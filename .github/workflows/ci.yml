name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run offline test suite
        # The suite is dependency-free (stdlib only); heavy deps (torch,
        # ortools, scrapegraphai, playwright, pymongo) are lazy and their
        # code paths are exercised manually, not in CI.
        run: python -m unittest discover -s tests -p "test_*.py" -v
